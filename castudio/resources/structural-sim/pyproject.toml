[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "cadflow-structural-sim"
version = "0.2.0"
requires-python = ">=3.12"
dependencies = ["numpy>=2", "scipy>=1.14", "pydantic>=2.10", "gmsh==4.15.2", "h5py>=3.12", "meshio==5.3.5", "reportlab>=4.2", "matplotlib>=3.9", "trimesh>=4", "pillow>=11", "python-docx>=1.1"]
[project.scripts]
structural-sim = "structural_sim.__main__:main"
[tool.setuptools.packages.find]
where = ["."]
include = ["structural_sim*", "strength*", "forge*"]
[tool.setuptools.package-data]
structural_sim = ["*.json", "presentation/*.png"]
